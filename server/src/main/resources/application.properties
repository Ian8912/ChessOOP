spring.application.name=server

# --- Database (PostgreSQL) ---
# Defaults target the local Docker Postgres (published on host port 5434).
# Deployments override these with environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/chessdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chess}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate manages the schema so a fresh database boots cleanly. For real
# production, introduce a migration tool (Flyway/Liquibase) and set this to "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Expose only the health endpoint for load-balancer / container health checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Shared secret required on write endpoints. Blank disables the guard (dev only);
# set APP_API_KEY in any deployed environment.
app.api-key=${APP_API_KEY:}
