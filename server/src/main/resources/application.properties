spring.application.name=server

# Default to the H2 dev profile. Production overrides this with the environment
# variable SPRING_PROFILES_ACTIVE=postgres.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Common JPA/diagnostics (apply to all profiles)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Expose only the health endpoint for load-balancer / container health checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Shared secret required on write endpoints. Blank disables the guard (dev only);
# set APP_API_KEY in any deployed environment.
app.api-key=${APP_API_KEY:}
